[project]
name = "play-with-misskey"
version = "1.0.0"
description = "Repository for playing with misskey"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "japanize-matplotlib>=1.1",
    "kaleido>=1.1",
    "pandas>=2.1",
    "plotly>=6.0",
    "requests>=2.30",
    "schedule>=1.2",
    "tqdm>=4.65",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.0",
    "pandas-stubs>=2.3",
    "types-requests>=2.30",
    "types-tqdm>=4.65",
]
